version: '3.8'

services:
  web:
    build: .
    container_name: projeto_extensao_api
    # Roda as migrations e inicia a api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # Puxa o arquivo .env
    env_file:
      - .env
